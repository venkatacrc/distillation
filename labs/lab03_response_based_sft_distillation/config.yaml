teacher_model: Qwen/Qwen2.5-7B-Instruct
student_base_model: Qwen/Qwen2.5-0.5B

train_prompts: 2000
eval_prompts: 100
seed: 0

generation:
  max_new_tokens: 256
  temperature: 0.7
  top_p: 0.9

sft:
  epochs: 3
  learning_rate: 2.0e-5
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  max_length: 1024
  warmup_ratio: 0.03

judge:
  # Reuses the teacher as judge for simplicity/cost - see the README's
  # "self-preference bias" caveat. Swap in a different/stronger model here
  # if you have one handy (e.g. Qwen2.5-32B-Instruct from lab08).
  model: Qwen/Qwen2.5-7B-Instruct
  max_new_tokens: 8
